<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Produtos</title>
</head>
<body>
    <h1>Catálogo de Produtos</h1>
    <ul>
        {% for produto in produtos %}
            <li>{{ produto.nome }} — R$ {{ produto.preco }}</li>
        {% endfor %}
    </ul>
</body>
</html>
